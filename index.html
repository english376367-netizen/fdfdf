gin-top:12px;line-height:1.6}button:disabled{opacity:.4;cursor:not-allowed}.feedback{margin-top:16px;padding:15px;border-radius:13px;line-height:1.65;display:none}.correct{display:block;background:#dcfce7;border:1px solid #86efac;color:#166534}.wrong{display:block;background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}.answer{font-weight:900;margin-top:8px}.structure{display:inline-block;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:8px;padding:7px 10px;margin-top:9px;font-weight:800}.explain{margin-top:9px;color:#374151}.explain p{margin:8px 0}.summary{text-align:center}.big{font-size:44px;font-weight:900;color:#4f46e5}@media(max-width:600px){.wrap{padding:8px}.card{padding:15px}h1{font-size:24px}textarea{font-size:17px}}
</style></head><body><div class="wrap"><div class="head"><h1>100 Sentence Transformation Structures</h1><p>Rewrite each sentence without changing its meaning.</p></div><div class="bar"><div id="progress">Question 1 of 100</div><div id="score">Score: 0 / 100</div></div><div id="app"></div></div>
<script>
const qs=[{"no": 1, "q": "It took Lan two hours to finish her homework.", "prompt": "Lan spent ______________________________.", "answer": "Lan spent two hours finishing her homework.", "structure": "spend + time + V-ing", "usage": "Công thức: S + spend/spent + khoảng thời gian + V-ing. Dùng để nói ai dành/mất bao lâu làm việc gì. Khi đổi từ “It takes/took + người + thời gian + to V”, đưa người thực hiện lên làm chủ ngữ và đổi to V thành V-ing.", "meaning": "Câu mới vẫn có nghĩa: Lan mất hai giờ hoàn thành bài tập về nhà.", "example": "Ví dụ: It took me an hour to cook. → I spent an hour cooking."}, {"no": 2, "q": "Do you understand this grammar rule?", "prompt": "Are you ______________________________?", "answer": "Are you aware of this grammar rule?", "structure": "be aware of", "usage": "Công thức: S + be + aware of + danh từ/cụm danh từ. Aware of nhấn mạnh nhận thức hoặc hiểu biết về một sự việc; đây là cách diễn đạt gần nghĩa trong ngữ cảnh bài tập.", "meaning": "“Are you aware of this grammar rule?” hỏi người nghe có nhận thức/biết quy tắc ngữ pháp này không.", "example": "Ví dụ: Do you know the danger? → Are you aware of the danger."}, {"no": 3, "q": "She likes reading books.", "prompt": "She is ______________________________.", "answer": "She is interested in reading books.", "structure": "be interested in + V-ing", "usage": "Công thức: S + be interested in + danh từ/V-ing. Giới từ in phải theo sau bởi danh từ hoặc V-ing, không dùng to V.", "meaning": "Câu chuyển diễn đạt rằng cô ấy quan tâm/thích việc đọc sách.", "example": "Ví dụ: He likes swimming. → He is interested in swimming."}, {"no": 4, "q": "He stayed home because he was sick.", "prompt": "He stayed home ______________________________.", "answer": "He stayed home because of his illness.", "structure": "because of + noun", "usage": "Công thức: because + S + V; because of + danh từ/cụm danh từ/V-ing. Because of không trực tiếp đi với một mệnh đề hoàn chỉnh.", "meaning": "“Because he was sick” được đổi thành “because of his illness”: mệnh đề được chuyển thành cụm danh từ illness.", "example": "Ví dụ: We stayed home because it rained. → We stayed home because of the rain."}, {"no": 5, "q": "Although the weather was bad, we went out.", "prompt": "Despite ______________________________, we went out.", "answer": "Despite the bad weather, we went out.", "structure": "despite + noun", "usage": "Công thức: Although + S + V, clause = Despite/In spite of + danh từ/cụm danh từ, clause. Sau despite không đặt nguyên mệnh đề, trừ mẫu despite the fact that + clause.", "meaning": "“The weather was bad” được rút thành cụm danh từ “the bad weather”; hai vế vẫn thể hiện sự tương phản.", "example": "Ví dụ: Although it was cold, we went out. → Despite the cold weather, we went out."}, {"no": 6, "q": "We succeeded in solving the problem.", "prompt": "We ______________________________ the problem.", "answer": "We managed to solve the problem.", "structure": "manage to + V", "usage": "Công thức: succeed in + V-ing = manage to + động từ nguyên mẫu có to. Sau in dùng V-ing; sau manage dùng to V.", "meaning": "Cả hai cách nói đều diễn tả đã làm được việc gì, thường sau nỗ lực hoặc khó khăn.", "example": "Ví dụ: She succeeded in passing. → She managed to pass."}, {"no": 7, "q": "The box is too heavy for me to carry.", "prompt": "The box is ______________________________.", "answer": "The box is not light enough for me to carry.", "structure": "not + adjective + enough + to V", "usage": "Công thức: too + tính từ + for someone + to V thường có thể đổi thành not + tính từ trái nghĩa + enough + for someone + to V. Enough đứng sau tính từ; chọn tính từ trái nghĩa phù hợp.", "meaning": "“Too heavy to carry” nghĩa là quá nặng để mang; “not light enough to carry” giữ ý không đủ nhẹ để mang.", "example": "Ví dụ: The box is too big to fit. → The box isn’t small enough to fit."}, {"no": 8, "q": "I prefer you to stay here.", "prompt": "I would rather ______________________________.", "answer": "I would rather you stayed here.", "structure": "would rather + subject + past verb", "usage": "Công thức: S1 + would rather + S2 + V quá khứ đơn. Dùng để nói người nói muốn người khác làm gì; động từ quá khứ diễn tả mong muốn hiện tại/tương lai, không nhất thiết là quá khứ thật.", "meaning": "“I would rather you stayed here” nghĩa là tôi muốn bạn ở lại đây. Phủ định: I’d rather you didn’t leave.", "example": "Ví dụ: I prefer you to wait. → I’d rather you waited."}, {"no": 9, "q": "She prefers staying home to going out.", "prompt": "She’d rather ______________________________.", "answer": "She’d rather stay home than go out.", "structure": "would rather + V + than + V", "usage": "Công thức: would rather + động từ nguyên mẫu không to + than + động từ nguyên mẫu không to. Dùng để nêu lựa chọn thích làm việc này hơn việc kia.", "meaning": "Hai hoạt động ở câu gốc dùng prefer V-ing to V-ing; khi đổi, dùng would rather stay than go.", "example": "Ví dụ: I prefer walking to driving. → I’d rather walk than drive."}, {"no": 10, "q": "I can swim across this river.", "prompt": "I am ______________________________.", "answer": "I am able to swim across this river.", "structure": "be able to + V", "usage": "Công thức: can + V = be able to + V. Be able to diễn tả khả năng và có thể chia theo các thì khi cần.", "meaning": "“I am able to swim” giữ nguyên ý “I can swim”: tôi có khả năng bơi qua con sông.", "example": "Ví dụ: She can drive. → She is able to drive."}, {"no": 11, "q": "As soon as I arrived, the meeting started.", "prompt": "Hardly ______________________________.", "answer": "Hardly had I arrived when the meeting started.", "structure": "Hardly had + S + V3 + when + S + V2", "usage": "Công thức đảo ngữ: Hardly + had + S + quá khứ phân từ (V3) + when + S + quá khứ đơn. Dùng khi một việc vừa xảy ra thì việc khác xảy ra ngay sau đó.", "meaning": "Đưa Hardly lên đầu câu nên phải đảo had lên trước chủ ngữ; arrived chuyển thành had arrived.", "example": "Ví dụ: As soon as he came, it rained. → Hardly had he come when it rained."}, {"no": 12, "q": "I don’t live here anymore.", "prompt": "I ______________________________ here.", "answer": "I no longer live here.", "structure": "no longer", "usage": "Công thức thông thường: S + no longer + động từ. No longer có nghĩa “không còn… nữa”; khi đưa no longer lên đầu câu, thường cần đảo ngữ.", "meaning": "“I don’t live here anymore” và “I no longer live here” cùng có nghĩa tôi không còn sống ở đây.", "example": "Ví dụ: She doesn’t work here anymore. → She no longer works here."}, {"no": 13, "q": "She never complained about the work.", "prompt": "At no time ______________________________.", "answer": "At no time did she complain about the work.", "structure": "At no time + inversion", "usage": "Công thức: At no time + trợ động từ + S + động từ chính. Cụm phủ định đứng đầu câu kéo theo đảo ngữ; ở quá khứ đơn, dùng did + S + V nguyên mẫu.", "meaning": "“At no time did she complain” nhấn mạnh cô ấy không hề phàn nàn vào bất cứ lúc nào.", "example": "Ví dụ: He never lied. → At no time did he lie."}, {"no": 14, "q": "This old computer is not worth repairing.", "prompt": "There ______________________________ this old computer.", "answer": "There is no point in repairing this old computer.", "structure": "there is no point in + V-ing", "usage": "Công thức: There is no point in + V-ing. Dùng để nói việc làm gì không có ích/không đáng làm. Sau giới từ in dùng V-ing.", "meaning": "Câu viết lại giữ ý rằng sửa chiếc máy tính/việc tranh cãi không đáng làm.", "example": "Ví dụ: It isn’t worth waiting. → There is no point in waiting."}, {"no": 15, "q": "It isn’t worth arguing with him.", "prompt": "There ______________________________ with him.", "answer": "There is no point in arguing with him.", "structure": "there is no point in + V-ing", "usage": "Công thức: There is no point in + V-ing. Dùng để nói việc làm gì không có ích/không đáng làm. Sau giới từ in dùng V-ing.", "meaning": "Câu viết lại giữ ý rằng sửa chiếc máy tính/việc tranh cãi không đáng làm.", "example": "Ví dụ: It isn’t worth waiting. → There is no point in waiting."}, {"no": 16, "q": "It seems that Tom will be late.", "prompt": "Tom ______________________________ late.", "answer": "Tom is likely to be late.", "structure": "be likely to + V", "usage": "Công thức: S + be likely to + V. Dùng để nói điều gì có khả năng xảy ra. Chọn is/are/was/were theo chủ ngữ và thì.", "meaning": "“Tom is likely to be late” nghĩa là Tom có khả năng sẽ đến muộn.", "example": "Ví dụ: It seems that she will win. → She is likely to win."}, {"no": 17, "q": "Although he was tired, he continued working.", "prompt": "Despite ______________________________, he continued working.", "answer": "Despite being tired, he continued working.", "structure": "despite + V-ing", "usage": "Công thức: Despite/In spite of + danh từ hoặc V-ing. Khi chủ thể của hành động trong hai vế phù hợp, có thể rút gọn mệnh đề although bằng V-ing hoặc cụm tính từ.", "meaning": "“Despite being tired” tương đương “Although he was tired”; hai vế thể hiện sự nhượng bộ.", "example": "Ví dụ: Although she was ill, she worked. → Despite being ill, she worked."}, {"no": 18, "q": "The soup has a wonderful taste.", "prompt": "The soup ______________________________.", "answer": "The soup is delicious.", "structure": "be + adjective", "usage": "Một số cụm “have + noun” có thể diễn đạt bằng “be + adjective” tương đương về nghĩa. Cần chọn tính từ tự nhiên trong ngữ cảnh; ví dụ taste → delicious.", "meaning": "“The soup is delicious” diễn đạt rằng món súp có vị ngon.", "example": "Ví dụ: The meal has a good taste. → The meal tastes good / is delicious."}, {"no": 19, "q": "The teacher is helpful to us.", "prompt": "The teacher ______________________________ us.", "answer": "The teacher helps us.", "structure": "verb + object", "usage": "Có thể chuyển cụm “be + adjective + to/for + object” sang động từ có nghĩa tương đương. Cần giữ đúng tân ngữ và nghĩa của tính từ.", "meaning": "“The teacher helps us” tương đương ý người giáo viên có ích/giúp đỡ chúng tôi trong ngữ cảnh này.", "example": "Ví dụ: She is helpful to me. → She helps me."}, {"no": 20, "q": "She is accustomed to getting up early.", "prompt": "She is ______________________________ early.", "answer": "She is used to getting up early.", "structure": "be used to + V-ing", "usage": "Công thức: S + be used to + danh từ/V-ing. Nghĩa là quen với việc gì. Lưu ý: “be used to” (quen với) khác “used to + V” (đã từng làm trong quá khứ).", "meaning": "“Be accustomed to getting up early” đổi thành “be used to getting up early”; to ở đây là giới từ nên dùng getting.", "example": "Ví dụ: He is accustomed to driving at night. → He is used to driving at night."}, {"no": 21, "q": "Nana often cries when she is worried.", "prompt": "Nana ______________________________ when she is worried.", "answer": "Nana is used to crying when she is worried.", "structure": "be used to + V-ing", "usage": "Công thức: S + be used to + danh từ/V-ing. Nghĩa là quen với việc gì. Lưu ý: “be used to” (quen với) khác “used to + V” (đã từng làm trong quá khứ).", "meaning": "“Be accustomed to getting up early” đổi thành “be used to getting up early”; to ở đây là giới từ nên dùng getting.", "example": "Ví dụ: He is accustomed to driving at night. → He is used to driving at night."}, {"no": 22, "q": "This is the first time I have eaten sushi.", "prompt": "I am ______________________________ sushi.", "answer": "I am not used to eating sushi.", "structure": "be not used to + V-ing", "usage": "Công thức chuẩn của “be not used to” là be + not + used to + danh từ/V-ing, nghĩa là chưa quen với điều gì. Tuy nhiên, đáp án gốc của bài này không hoàn toàn tương đương về nghĩa với câu “This is the first time…”. Hãy lưu ý khác biệt này khi học.", "meaning": "Câu gốc nói đây là lần đầu ăn sushi; đáp án được giữ nguyên theo bài gốc nhưng nghĩa “chưa quen ăn sushi” không hoàn toàn giống “lần đầu ăn sushi”.", "example": "Ví dụ: I have never driven before. (Tôi chưa từng lái xe.) / I’m not used to driving. (Tôi chưa quen lái xe.)"}, {"no": 23, "q": "I would prefer to stay at home.", "prompt": "I would rather ______________________________.", "answer": "I would rather stay at home.", "structure": "would rather + V", "usage": "Công thức: would rather + động từ nguyên mẫu không to. Dùng để nói thích/chọn làm điều gì hơn; nếu so sánh hai hành động, dùng would rather V than V.", "meaning": "“I would rather stay at home” có nghĩa tôi muốn ở nhà hơn.", "example": "Ví dụ: I would prefer to rest. → I would rather rest."}, {"no": 24, "q": "I prefer going shopping to playing volleyball.", "prompt": "I would rather ______________________________.", "answer": "I would rather go shopping than play volleyball.", "structure": "would rather + V + than + V", "usage": "Công thức: would rather + động từ nguyên mẫu không to + than + động từ nguyên mẫu không to. Dùng để nêu lựa chọn thích làm việc này hơn việc kia.", "meaning": "Hai hoạt động ở câu gốc dùng prefer V-ing to V-ing; khi đổi, dùng would rather stay than go.", "example": "Ví dụ: I prefer walking to driving. → I’d rather walk than drive."}, {"no": 25, "q": "People find it difficult to learn this language.", "prompt": "People ______________________________ this language.", "answer": "People find it difficult to learn this language.", "structure": "find + it + adjective + to V", "usage": "Công thức: S + find + it + adjective + to V. It là tân ngữ giả, còn hành động to V được đặt ở cuối câu. Dùng để đánh giá một hành động là khó, dễ, thú vị…", "meaning": "Câu gốc và đáp án đều nói việc học ngôn ngữ này khó; trong trang gốc câu chuyển đổi gần như giữ nguyên.", "example": "Ví dụ: I find it hard to focus."}, {"no": 26, "q": "Learning English is important.", "prompt": "It is ______________________________.", "answer": "It is important to learn English.", "structure": "It + be + adjective + to V", "usage": "Công thức: To V + be + adjective có thể đổi thành It + be + adjective + to V. It là chủ ngữ giả, giúp đưa hành động về cuối câu.", "meaning": "“It is important to learn English” nghĩa là học tiếng Anh rất quan trọng.", "example": "Ví dụ: To exercise daily is useful. → It is useful to exercise daily."}, {"no": 27, "q": "It is your duty to finish the report.", "prompt": "You ______________________________ the report.", "answer": "You are supposed to finish the report.", "structure": "be supposed to + V", "usage": "Công thức: S + be supposed to + V nguyên mẫu. Diễn tả điều được yêu cầu, mong đợi hoặc có trách nhiệm phải làm.", "meaning": "“You are supposed to finish the report” nghĩa là bạn được mong đợi/có trách nhiệm hoàn thành báo cáo.", "example": "Ví dụ: It is your duty to help. → You are supposed to help."}, {"no": 28, "q": "The students are expected to arrive at 7.", "prompt": "The students ______________________________ at 7.", "answer": "The students are supposed to arrive at 7.", "structure": "be supposed to + V", "usage": "Công thức: S + be supposed to + V nguyên mẫu. Diễn tả điều được yêu cầu, mong đợi hoặc có trách nhiệm phải làm.", "meaning": "“You are supposed to finish the report” nghĩa là bạn được mong đợi/có trách nhiệm hoàn thành báo cáo.", "example": "Ví dụ: It is your duty to help. → You are supposed to help."}, {"no": 29, "q": "Close the door.", "prompt": "The door ______________________________.", "answer": "The door should be closed.", "structure": "should + be + V3", "usage": "Công thức bị động với should: S + should + be + V3. Dùng khi nói một việc nên được thực hiện với đối tượng làm chủ ngữ.", "meaning": "“The door should be closed” nghĩa là cánh cửa nên được đóng; đây là cách diễn đạt lời hướng dẫn/khuyến nghị.", "example": "Ví dụ: Clean the room. → The room should be cleaned."}, {"no": 30, "q": "Don’t use your phone in class.", "prompt": "You ______________________________ your phone in class.", "answer": "You should not use your phone in class.", "structure": "should not + V", "usage": "Công thức: S + should not + V nguyên mẫu. Dùng để chuyển mệnh lệnh phủ định thành lời khuyên hoặc quy tắc không nên làm.", "meaning": "“You should not use your phone” nghĩa là bạn không nên dùng điện thoại trong lớp.", "example": "Ví dụ: Don’t run here. → You should not run here."}, {"no": 31, "q": "I like collecting stamps.", "prompt": "I am ______________________________.", "answer": "I am fond of collecting stamps.", "structure": "be fond of + V-ing", "usage": "Công thức: be fond of + danh từ/V-ing. Diễn tả thích hoặc yêu thích điều gì; of là giới từ nên động từ theo sau ở dạng V-ing.", "meaning": "“I am fond of collecting stamps” nghĩa là tôi thích sưu tầm tem.", "example": "Ví dụ: He likes reading. → He is fond of reading."}, {"no": 32, "q": "My boss let me leave early.", "prompt": "My boss ______________________________ early.", "answer": "My boss allowed me to leave early.", "structure": "allow + object + to V", "usage": "Công thức: let + O + V nguyên mẫu = allow + O + to V. Let không có to; allow có to trước động từ.", "meaning": "“My boss allowed me to leave early” nghĩa là sếp cho phép tôi về sớm.", "example": "Ví dụ: They let us enter. → They allowed us to enter."}, {"no": 33, "q": "She once lived in London.", "prompt": "She ______________________________ in London.", "answer": "She would live in London.", "structure": "would + V (past habit)", "usage": "Would + V có thể diễn tả hành động lặp đi lặp lại trong quá khứ, nhưng thường không dùng cho trạng thái kéo dài như live. Ngoài ra, câu “He doesn’t smoke anymore” không thể đổi thành “He would smoke” mà giữ nguyên nghĩa. Đáp án được giữ theo bài gốc; hãy xem đây là điểm cần lưu ý, không phải phép đổi tương đương chuẩn.", "meaning": "“She once lived in London” nói về một sự kiện/trạng thái trong quá khứ; “would live” thường cần ngữ cảnh thói quen lặp lại. Câu 34 cũng không giữ nghĩa phủ định của anymore.", "example": "Ví dụ đúng: When we were children, we would play outside every day."}, {"no": 34, "q": "He doesn’t smoke anymore.", "prompt": "He ______________________________.", "answer": "He would smoke.", "structure": "would + V (past habit)", "usage": "Would + V có thể diễn tả hành động lặp đi lặp lại trong quá khứ, nhưng thường không dùng cho trạng thái kéo dài như live. Ngoài ra, câu “He doesn’t smoke anymore” không thể đổi thành “He would smoke” mà giữ nguyên nghĩa. Đáp án được giữ theo bài gốc; hãy xem đây là điểm cần lưu ý, không phải phép đổi tương đương chuẩn.", "meaning": "“She once lived in London” nói về một sự kiện/trạng thái trong quá khứ; “would live” thường cần ngữ cảnh thói quen lặp lại. Câu 34 cũng không giữ nghĩa phủ định của anymore.", "example": "Ví dụ đúng: When we were children, we would play outside every day."}, {"no": 35, "q": "She studies hard because she wants to pass.", "prompt": "She studies hard ______________________________.", "answer": "She studies hard to pass.", "structure": "to-infinitive of purpose", "usage": "Công thức: S + V + to/in order to + V nguyên mẫu để diễn tả mục đích. Có thể đổi so that + S + can/could + V thành to + V khi chủ thể của hành động mục đích phù hợp.", "meaning": "“He saved money to buy a car” nghĩa là anh ấy tiết kiệm tiền nhằm mua ô tô.", "example": "Ví dụ: She went early so that she could get a seat. → She went early to get a seat."}, {"no": 36, "q": "He saved money so that he could buy a car.", "prompt": "He saved money ______________________________ a car.", "answer": "He saved money to buy a car.", "structure": "to-infinitive of purpose", "usage": "Công thức: S + V + to/in order to + V nguyên mẫu để diễn tả mục đích. Có thể đổi so that + S + can/could + V thành to + V khi chủ thể của hành động mục đích phù hợp.", "meaning": "“He saved money to buy a car” nghĩa là anh ấy tiết kiệm tiền nhằm mua ô tô.", "example": "Ví dụ: She went early so that she could get a seat. → She went early to get a seat."}, {"no": 37, "q": "To travel alone is exciting.", "prompt": "It is ______________________________ alone.", "answer": "It is exciting to travel alone.", "structure": "It + be + adjective + to V", "usage": "Công thức: To V + be + adjective có thể đổi thành It + be + adjective + to V. It là chủ ngữ giả, giúp đưa hành động về cuối câu.", "meaning": "“It is important to learn English” nghĩa là học tiếng Anh rất quan trọng.", "example": "Ví dụ: To exercise daily is useful. → It is useful to exercise daily."}, {"no": 38, "q": "Tom sings and dances.", "prompt": "Tom ______________________________.", "answer": "Tom both sings and dances.", "structure": "both ... and", "usage": "Công thức: both + thành phần A + and + thành phần B. Dùng để nhấn mạnh cả hai người/vật/hoạt động đều đúng; hai thành phần nên song song về ngữ pháp.", "meaning": "“Tom both sings and dances” nghĩa là Tom vừa hát vừa nhảy.", "example": "Ví dụ: She speaks English and French. → She speaks both English and French."}, {"no": 39, "q": "She can speak English and French.", "prompt": "She can speak ______________________________.", "answer": "She can speak both English and French.", "structure": "both ... and", "usage": "Công thức: both + thành phần A + and + thành phần B. Dùng để nhấn mạnh cả hai người/vật/hoạt động đều đúng; hai thành phần nên song song về ngữ pháp.", "meaning": "“Tom both sings and dances” nghĩa là Tom vừa hát vừa nhảy.", "example": "Ví dụ: She speaks English and French. → She speaks both English and French."}, {"no": 40, "q": "He translated fast and correctly.", "prompt": "He translated ______________________________.", "answer": "He translated not only fast but also correctly.", "structure": "not only ... but also", "usage": "Công thức: not only + A + but also + B. Dùng để nhấn mạnh hai đặc điểm/hành động cùng đúng; A và B cần cùng loại cấu trúc.", "meaning": "Câu mới nhấn mạnh anh ấy dịch vừa nhanh vừa chính xác, hoặc cô ấy vừa thông minh vừa chăm chỉ.", "example": "Ví dụ: He is kind and patient. → He is not only kind but also patient."}, {"no": 41, "q": "She is both intelligent and hardworking.", "prompt": "She is ______________________________.", "answer": "She is not only intelligent but also hardworking.", "structure": "not only ... but also", "usage": "Công thức: not only + A + but also + B. Dùng để nhấn mạnh hai đặc điểm/hành động cùng đúng; A và B cần cùng loại cấu trúc.", "meaning": "Câu mới nhấn mạnh anh ấy dịch vừa nhanh vừa chính xác, hoặc cô ấy vừa thông minh vừa chăm chỉ.", "example": "Ví dụ: He is kind and patient. → He is not only kind but also patient."}, {"no": 42, "q": "You study hard and you will pass the exam.", "prompt": "If ______________________________, you will pass the exam.", "answer": "If you study hard, you will pass the exam.", "structure": "First conditional", "usage": "Công thức: If + hiện tại đơn, S + will + V. Dùng cho điều kiện có thể xảy ra ở hiện tại/tương lai và kết quả có khả năng xảy ra. Không dùng will trong mệnh đề if thông thường.", "meaning": "“If you study hard, you will pass” diễn tả nếu bạn học chăm thì bạn sẽ đỗ.", "example": "Ví dụ: Hurry up and you’ll catch the bus. → If you hurry up, you’ll catch the bus."}, {"no": 43, "q": "He didn’t work hard, so he failed the exam.", "prompt": "If ______________________________, he would have passed the exam.", "answer": "If he had worked hard, he would have passed the exam.", "structure": "Third conditional", "usage": "Công thức: If + S + had + V3, S + would have + V3. Dùng để nói tình huống trái thực tế trong quá khứ và kết quả giả định.", "meaning": "Câu mới có nghĩa nếu anh ấy đã học chăm chỉ thì anh ấy đã đỗ; thực tế anh ấy không học chăm và đã trượt.", "example": "Ví dụ: If I had left earlier, I would have caught the train."}, {"no": 44, "q": "I don’t have enough money, so I can’t buy it.", "prompt": "If ______________________________, I could buy it.", "answer": "If I had enough money, I could buy it.", "structure": "Second conditional", "usage": "Công thức: If + S + V quá khứ đơn, S + would/could + V nguyên mẫu. Dùng cho tình huống giả định hoặc không có thật ở hiện tại/tương lai.", "meaning": "“If I had enough money, I could buy it” nghĩa là nếu tôi có đủ tiền thì tôi có thể mua nó; thực tế hiện tại tôi không đủ tiền.", "example": "Ví dụ: If I were rich, I would travel more."}, {"no": 45, "q": "You won’t pass if you don’t study.", "prompt": "You won’t pass ______________________________.", "answer": "You won’t pass unless you study.", "structure": "unless + affirmative clause", "usage": "Công thức: unless + mệnh đề khẳng định thường tương đương if + mệnh đề phủ định. Không thêm not sau unless trong cách chuyển đổi thông thường.", "meaning": "“You won’t pass unless you study” nghĩa là bạn sẽ không đỗ nếu bạn không học.", "example": "Ví dụ: If you don’t hurry, you’ll be late. → Unless you hurry, you’ll be late."}, {"no": 46, "q": "If you don’t hurry, you will miss the bus.", "prompt": "You will miss the bus ______________________________.", "answer": "You will miss the bus unless you hurry.", "structure": "unless + affirmative clause", "usage": "Công thức: unless + mệnh đề khẳng định thường tương đương if + mệnh đề phủ định. Không thêm not sau unless trong cách chuyển đổi thông thường.", "meaning": "“You won’t pass unless you study” nghĩa là bạn sẽ không đỗ nếu bạn không học.", "example": "Ví dụ: If you don’t hurry, you’ll be late. → Unless you hurry, you’ll be late."}, {"no": 47, "q": "I met a girl. She won the competition.", "prompt": "The girl ______________________________ won the competition.", "answer": "The girl who I met won the competition.", "structure": "relative pronoun who", "usage": "Công thức: danh từ chỉ người + who + mệnh đề quan hệ. Who thường làm chủ ngữ của mệnh đề quan hệ; trong câu này đáp án nguồn dùng who làm tân ngữ, cách tự nhiên hơn có thể là “The girl whom I met…” hoặc “The girl I met…”.", "meaning": "Câu kết hợp hai câu: tôi gặp một cô gái; cô ấy thắng cuộc thi.", "example": "Ví dụ: The boy who lives next door is kind."}, {"no": 48, "q": "This is the school. I studied there.", "prompt": "This is the school ______________________________.", "answer": "This is the school where I studied.", "structure": "relative adverb where", "usage": "Công thức: danh từ chỉ nơi chốn + where + S + V. Where có nghĩa “ở nơi mà” và thay cho cụm giới từ chỉ nơi chốn trong mệnh đề quan hệ.", "meaning": "Câu nói đây là ngôi trường nơi tôi học.", "example": "Ví dụ: This is the house where I was born."}, {"no": 49, "q": "I met the man. You talked to him yesterday.", "prompt": "I met the man ______________________________ yesterday.", "answer": "I met the man whom you talked to yesterday.", "structure": "whom", "usage": "Công thức: danh từ chỉ người + whom + S + V; whom là tân ngữ của động từ/giới từ trong mệnh đề quan hệ, thường trang trọng hơn who. Có thể đặt giới từ cuối mệnh đề trong tiếng Anh thông dụng.", "meaning": "Hai câu được gộp lại để “the man” là danh từ được bổ nghĩa bởi mệnh đề “you talked to him”.", "example": "Ví dụ: The woman whom I met was friendly."}, {"no": 50, "q": "This is the book. I bought it yesterday.", "prompt": "This is the book ______________________________ yesterday.", "answer": "This is the book which I bought yesterday.", "structure": "which", "usage": "Công thức: danh từ chỉ vật + which + mệnh đề quan hệ. Which dùng cho vật/động vật; trong mệnh đề xác định có thể dùng that hoặc lược đại từ khi nó làm tân ngữ.", "meaning": "Hai câu được gộp để “the book” được bổ nghĩa bởi thông tin tôi mua nó hôm qua.", "example": "Ví dụ: The phone which I bought is new."}, {"no": 51, "q": "The car is very expensive. My father bought it.", "prompt": "The car ______________________________ is very expensive.", "answer": "The car that my father bought is very expensive.", "structure": "that", "usage": "Công thức: danh từ + that + mệnh đề quan hệ xác định. That có thể dùng cho người hoặc vật trong mệnh đề xác định; không dùng that trong mệnh đề không xác định có dấu phẩy.", "meaning": "Mệnh đề “that my father bought” xác định chiếc xe nào đang được nói tới.", "example": "Ví dụ: The cake that she made was delicious."}, {"no": 52, "q": "She is scared of spiders.", "prompt": "She is ______________________________ spiders.", "answer": "She is afraid of spiders.", "structure": "be afraid of", "usage": "Công thức: be afraid of + danh từ/V-ing. Afraid of và scared of đều có nghĩa là sợ; sau of dùng danh từ hoặc V-ing.", "meaning": "Câu viết lại giữ nguyên ý cô ấy sợ nhện.", "example": "Ví dụ: He is scared of dogs. → He is afraid of dogs."}, {"no": 53, "q": "Let’s go for a walk.", "prompt": "She suggested ______________________________.", "answer": "She suggested that we go for a walk.", "structure": "suggest that + subject + base verb", "usage": "Công thức: suggest that + S + (should) + V nguyên mẫu. Dùng để nêu đề xuất/lời khuyên. Trong tiếng Anh Anh, có thể dùng should; trong tiếng Anh Mỹ thường dùng động từ nguyên mẫu.", "meaning": "Câu đề xuất một người/nhóm cùng đi dạo, tham gia câu lạc bộ hoặc nghỉ ngơi. Cần xác định đúng chủ thể sau suggest.", "example": "Ví dụ: I suggest that we leave early."}, {"no": 54, "q": "In my opinion, we should leave now.", "prompt": "I suggest ______________________________ now.", "answer": "I suggest that we leave now.", "structure": "suggest that + subject + base verb", "usage": "Công thức: suggest that + S + (should) + V nguyên mẫu. Dùng để nêu đề xuất/lời khuyên. Trong tiếng Anh Anh, có thể dùng should; trong tiếng Anh Mỹ thường dùng động từ nguyên mẫu.", "meaning": "Câu đề xuất một người/nhóm cùng đi dạo, tham gia câu lạc bộ hoặc nghỉ ngơi. Cần xác định đúng chủ thể sau suggest.", "example": "Ví dụ: I suggest that we leave early."}, {"no": 55, "q": "The doctor advised me to rest.", "prompt": "The doctor suggested ______________________________.", "answer": "The doctor suggested that I rest.", "structure": "suggest that + subject + base verb", "usage": "Công thức: suggest that + S + (should) + V nguyên mẫu. Dùng để nêu đề xuất/lời khuyên. Trong tiếng Anh Anh, có thể dùng should; trong tiếng Anh Mỹ thường dùng động từ nguyên mẫu.", "meaning": "Câu đề xuất một người/nhóm cùng đi dạo, tham gia câu lạc bộ hoặc nghỉ ngơi. Cần xác định đúng chủ thể sau suggest.", "example": "Ví dụ: I suggest that we leave early."}, {"no": 56, "q": "Why don’t you join the club?", "prompt": "I suggest ______________________________ the club.", "answer": "I suggest that you join the club.", "structure": "suggest that + subject + base verb", "usage": "Công thức: suggest that + S + (should) + V nguyên mẫu. Dùng để nêu đề xuất/lời khuyên. Trong tiếng Anh Anh, có thể dùng should; trong tiếng Anh Mỹ thường dùng động từ nguyên mẫu.", "meaning": "Câu đề xuất một người/nhóm cùng đi dạo, tham gia câu lạc bộ hoặc nghỉ ngơi. Cần xác định đúng chủ thể sau suggest.", "example": "Ví dụ: I suggest that we leave early."}, {"no": 57, "q": "She gets him to clean the room.", "prompt": "She ______________________________ the room.", "answer": "She has him clean the room.", "structure": "have + object + bare infinitive", "usage": "Công thức sai khiến: have + object + động từ nguyên mẫu không to. Dùng khi sắp xếp/nhờ/yêu cầu ai thực hiện hành động. Get thường dùng get + O + to V.", "meaning": "Đáp án chuyển động từ theo sau tân ngữ thành dạng nguyên mẫu không to. Tuy nhiên, với các câu dùng ask/request/want, sắc thái nghĩa có thể khác; không phải mọi trường hợp đều thay thế hoàn toàn tương đương.", "example": "Ví dụ: I got him to check it. → I had him check it."}, {"no": 58, "q": "The police asked him to open the door.", "prompt": "The police ______________________________ the door.", "answer": "The police had him open the door.", "structure": "have + object + bare infinitive", "usage": "Công thức sai khiến: have + object + động từ nguyên mẫu không to. Dùng khi sắp xếp/nhờ/yêu cầu ai thực hiện hành động. Get thường dùng get + O + to V.", "meaning": "Đáp án chuyển động từ theo sau tân ngữ thành dạng nguyên mẫu không to. Tuy nhiên, với các câu dùng ask/request/want, sắc thái nghĩa có thể khác; không phải mọi trường hợp đều thay thế hoàn toàn tương đương.", "example": "Ví dụ: I got him to check it. → I had him check it."}, {"no": 59, "q": "The teacher requested students to submit the work.", "prompt": "The teacher ______________________________ the work.", "answer": "The teacher had students submit the work.", "structure": "have + object + bare infinitive", "usage": "Công thức sai khiến: have + object + động từ nguyên mẫu không to. Dùng khi sắp xếp/nhờ/yêu cầu ai thực hiện hành động. Get thường dùng get + O + to V.", "meaning": "Đáp án chuyển động từ theo sau tân ngữ thành dạng nguyên mẫu không to. Tuy nhiên, với các câu dùng ask/request/want, sắc thái nghĩa có thể khác; không phải mọi trường hợp đều thay thế hoàn toàn tương đương.", "example": "Ví dụ: I got him to check it. → I had him check it."}, {"no": 60, "q": "I want her to call me.", "prompt": "I ______________________________ me.", "answer": "I have her call me.", "structure": "have + object + bare infinitive", "usage": "Công thức sai khiến: have + object + động từ nguyên mẫu không to. Dùng khi sắp xếp/nhờ/yêu cầu ai thực hiện hành động. Get thường dùng get + O + to V.", "meaning": "Đáp án chuyển động từ theo sau tân ngữ thành dạng nguyên mẫu không to. Tuy nhiên, với các câu dùng ask/request/want, sắc thái nghĩa có thể khác; không phải mọi trường hợp đều thay thế hoàn toàn tương đương.", "example": "Ví dụ: I got him to check it. → I had him check it."}, {"no": 61, "q": "She has no care when she speaks.", "prompt": "She is ______________________________ when she speaks.", "answer": "She is careless when she speaks.", "structure": "noun + -less / adjective", "usage": "Công thức: một số danh từ thêm -less tạo tính từ nghĩa là “không có/thiếu”, ví dụ care → careless, hope → hopeless. Cần kiểm tra từ tạo thành có tồn tại và phù hợp nghĩa.", "meaning": "“Careless” mô tả người nói thiếu cẩn trọng.", "example": "Ví dụ: He showed no care. → He was careless."}, {"no": 62, "q": "It is necessary that you study regularly.", "prompt": "It is ______________________________ regularly.", "answer": "It is necessary to study regularly.", "structure": "adjective + to-infinitive", "usage": "Công thức: It is + adjective + to V. Dùng để đánh giá hành động là cần thiết, quan trọng, khó, dễ… Khi đổi từ that-clause, cần bảo đảm chủ thể của hành động được hiểu đúng.", "meaning": "“It is necessary to study regularly” nghĩa là việc học đều đặn là cần thiết.", "example": "Ví dụ: It is important that we act. → It is important to act."}, {"no": 63, "q": "My students are good at Mathematics.", "prompt": "My students ______________________________.", "answer": "My students study Mathematics well.", "structure": "adjective + prep → verb + adverb", "usage": "Có thể đổi cụm be + adjective + preposition thành động từ có nghĩa tương đương. Động từ phải hợp nghĩa và trạng từ bổ nghĩa cho hành động.", "meaning": "“Study Mathematics well” diễn đạt ý học toán tốt. Cách đổi phụ thuộc vào cụm tính từ gốc.", "example": "Ví dụ: He is a good driver. → He drives well."}, {"no": 64, "q": "I remember to call him tomorrow.", "prompt": "I ______________________________ him tomorrow.", "answer": "I don’t forget to call him tomorrow.", "structure": "remember to V = don't forget to V", "usage": "Công thức: remember to V = don’t forget to V, đều nói nhớ/đừng quên làm một việc cần thực hiện. Phân biệt remember doing = nhớ đã làm việc gì.", "meaning": "Câu nói người nói sẽ không quên gọi cho anh ấy ngày mai. “I don’t forget to call…” kém tự nhiên hơn “I won’t forget to call…” nhưng đáp án gốc được giữ lại.", "example": "Ví dụ: Remember to lock the door. → Don’t forget to lock the door."}, {"no": 65, "q": "It was an interesting film.", "prompt": "What ______________________________!", "answer": "What an interesting film!", "structure": "What + a/an + adjective + noun!", "usage": "Công thức: What + a/an + adjective + danh từ đếm được số ít! Dùng để bộc lộ cảm xúc mạnh. Chọn a/an theo âm đầu của từ ngay sau mạo từ.", "meaning": "“What an interesting film!” thể hiện sự cảm thán về bộ phim thú vị; interesting bắt đầu bằng âm nguyên âm nên dùng an.", "example": "Ví dụ: It is a lovely day. → What a lovely day!"}, {"no": 66, "q": "She speaks English fluently.", "prompt": "How ______________________________!", "answer": "How fluently she speaks English!", "structure": "How + adverb + subject + verb", "usage": "Công thức: How + trạng từ + S + V! dùng để cảm thán về cách một hành động diễn ra. Nếu tính từ mô tả chủ ngữ, dùng How + adjective + S + be.", "meaning": "“How fluently she speaks English!” khen cách cô ấy nói tiếng Anh rất trôi chảy.", "example": "Ví dụ: He runs quickly. → How quickly he runs!"}, {"no": 67, "q": "The movie was exciting.", "prompt": "The audience was ______________________________.", "answer": "The audience was excited.", "structure": "-ing adjective → -ed adjective", "usage": "Tính từ -ing mô tả thứ/người gây ra cảm xúc; tính từ -ed mô tả người/đối tượng cảm nhận cảm xúc. Exciting = gây hào hứng; excited = cảm thấy hào hứng.", "meaning": "Bộ phim gây hào hứng nên khán giả cảm thấy hào hứng.", "example": "Ví dụ: The lesson is boring. The students are bored."}, {"no": 68, "q": "The news surprised me.", "prompt": "I was ______________________________ the news.", "answer": "I was surprised by the news.", "structure": "verb → be + past participle adjective", "usage": "Cấu trúc bị động/trạng thái: S + be + V3 (+ by + tác nhân). Dùng khi chủ ngữ nhận tác động của hành động; thì được thể hiện qua động từ be.", "meaning": "“I was surprised by the news” nghĩa là tôi bị tin tức đó làm ngạc nhiên.", "example": "Ví dụ: The result shocked me. → I was shocked by the result."}, {"no": 69, "q": "She learned English for five years.", "prompt": "It ______________________________ English.", "answer": "It took her five years to learn English.", "structure": "It takes + object + time + to V", "usage": "Công thức: It takes/took + người + khoảng thời gian + to V. Dùng để nói một người mất bao lâu làm việc gì; dùng took cho quá khứ.", "meaning": "“It took her five years to learn English” nói cô ấy mất năm năm để học tiếng Anh.", "example": "Ví dụ: She spent two hours reading. → It took her two hours to read."}, {"no": 70, "q": "The water is too hot for Peter to drink.", "prompt": "The water is ______________________________.", "answer": "The water is so hot that Peter can’t drink it.", "structure": "so + adjective + that + cannot", "usage": "Công thức: too + adjective + for + O + to V = so + adjective + that + S + can’t/couldn’t + V. So…that cần một mệnh đề đầy đủ sau that.", "meaning": "Nước nóng đến mức Peter không thể uống. Câu mới thêm đại từ it làm tân ngữ của drink.", "example": "Ví dụ: The box is too heavy to lift. → The box is so heavy that I can’t lift it."}, {"no": 71, "q": "He ran too slowly to catch the bus.", "prompt": "He ran ______________________________ the bus.", "answer": "He ran so slowly that he couldn’t catch the bus.", "structure": "so + adverb + that + cannot", "usage": "Công thức: too + adverb + to V = so + adverb + that + S + can’t/couldn’t + V. Chọn can’t/couldn’t theo thời gian và ngữ cảnh.", "meaning": "Anh ấy chạy chậm đến mức không thể bắt kịp xe buýt.", "example": "Ví dụ: He spoke too quietly to hear. → He spoke so quietly that I couldn’t hear him."}, {"no": 72, "q": "The bag is so heavy that I can’t lift it.", "prompt": "The bag is ______________________________.", "answer": "The bag is not light enough for me to lift.", "structure": "not + adjective + enough + to V", "usage": "Công thức: too + tính từ + for someone + to V thường có thể đổi thành not + tính từ trái nghĩa + enough + for someone + to V. Enough đứng sau tính từ; chọn tính từ trái nghĩa phù hợp.", "meaning": "“Too heavy to carry” nghĩa là quá nặng để mang; “not light enough to carry” giữ ý không đủ nhẹ để mang.", "example": "Ví dụ: The box is too big to fit. → The box isn’t small enough to fit."}, {"no": 73, "q": "The water is too cold to swim in.", "prompt": "The water is ______________________________.", "answer": "The water is not warm enough to swim in.", "structure": "not + adjective + enough + to V", "usage": "Công thức: too + tính từ + for someone + to V thường có thể đổi thành not + tính từ trái nghĩa + enough + for someone + to V. Enough đứng sau tính từ; chọn tính từ trái nghĩa phù hợp.", "meaning": "“Too heavy to carry” nghĩa là quá nặng để mang; “not light enough to carry” giữ ý không đủ nhẹ để mang.", "example": "Ví dụ: The box is too big to fit. → The box isn’t small enough to fit."}, {"no": 74, "q": "He speaks so softly that I can’t hear him.", "prompt": "He speaks ______________________________ hear him.", "answer": "He speaks too softly for me to hear him.", "structure": "too + adverb + for + object + to V", "usage": "Công thức: too + trạng từ + for + người/vật + to V. Diễn tả hành động diễn ra ở mức độ quá… khiến ai đó không thể làm việc gì.", "meaning": "Anh ấy nói quá nhỏ nên tôi không thể nghe thấy anh ấy.", "example": "Ví dụ: She walked too slowly for us to keep up."}, {"no": 75, "q": "Because she was absent, she missed the meeting.", "prompt": "Because of ______________________________, she missed the meeting.", "answer": "Because of her absence, she missed the meeting.", "structure": "because of + noun", "usage": "Công thức: because + S + V; because of + danh từ/cụm danh từ/V-ing. Because of không trực tiếp đi với một mệnh đề hoàn chỉnh.", "meaning": "“Because he was sick” được đổi thành “because of his illness”: mệnh đề được chuyển thành cụm danh từ illness.", "example": "Ví dụ: We stayed home because it rained. → We stayed home because of the rain."}, {"no": 76, "q": "Look at the picture.", "prompt": "Have ______________________________ the picture.", "answer": "Have a look at the picture.", "structure": "have a look at", "usage": "Công thức: look at + object = have a look at + object. Cụm have a look at thường dùng khi yêu cầu ai xem/nhìn một thứ.", "meaning": "“Have a look at the picture” nghĩa là hãy xem bức tranh.", "example": "Ví dụ: Look at this note. → Have a look at this note."}, {"no": 77, "q": "I often think about my future.", "prompt": "I often ______________________________ my future.", "answer": "I often give thought to my future.", "structure": "give thought to", "usage": "Công thức: think about + noun = give thought to + noun. To trong “give thought to” là giới từ, nên nếu theo sau là động từ thì dùng V-ing.", "meaning": "Câu mới nói người nói thường suy nghĩ/cân nhắc về tương lai.", "example": "Ví dụ: Think about the offer. → Give some thought to the offer."}, {"no": 78, "q": "She is determined to succeed.", "prompt": "She ______________________________ to succeed.", "answer": "She has a determination to succeed.", "structure": "have a determination to", "usage": "Công thức danh từ: be determined to V có thể diễn đạt bằng have a determination to V, dù “determination to” thường tự nhiên hơn trong nhiều ngữ cảnh.", "meaning": "Câu mới nhấn mạnh cô ấy có quyết tâm thành công.", "example": "Ví dụ: He is determined to win. → He has the determination to win."}, {"no": 79, "q": "I know about the problem.", "prompt": "I ______________________________ the problem.", "answer": "I have knowledge of the problem.", "structure": "have knowledge of", "usage": "Công thức: know about + noun có thể diễn đạt trang trọng hơn bằng have knowledge of + noun.", "meaning": "Câu mới nói người nói có kiến thức/biết về vấn đề đó.", "example": "Ví dụ: She knows about the topic. → She has knowledge of the topic."}, {"no": 80, "q": "It is not worth repairing the old bike.", "prompt": "There ______________________________ the old bike.", "answer": "There is no point in repairing the old bike.", "structure": "there is no point in + V-ing", "usage": "Công thức: There is no point in + V-ing. Dùng để nói việc làm gì không có ích/không đáng làm. Sau giới từ in dùng V-ing.", "meaning": "Câu viết lại giữ ý rằng sửa chiếc máy tính/việc tranh cãi không đáng làm.", "example": "Ví dụ: It isn’t worth waiting. → There is no point in waiting."}, {"no": 81, "q": "Young people tend to use social media a lot.", "prompt": "Young people ______________________________ social media a lot.", "answer": "Young people have a tendency to use social media a lot.", "structure": "have a tendency to", "usage": "Công thức: tend to + V = have a tendency to + V. Diễn tả xu hướng hoặc khuynh hướng thường làm gì.", "meaning": "Câu mới nói người trẻ có xu hướng sử dụng mạng xã hội nhiều.", "example": "Ví dụ: Children tend to ask questions. → Children have a tendency to ask questions."}, {"no": 82, "q": "They intend to move next year.", "prompt": "They ______________________________ next year.", "answer": "They have the intention of moving next year.", "structure": "have the intention of + V-ing", "usage": "Công thức: intend to V = have the intention of + V-ing. Sau giới từ of phải dùng danh từ hoặc V-ing.", "meaning": "Câu mới giữ ý họ dự định chuyển nhà vào năm sau.", "example": "Ví dụ: I intend to apply. → I have the intention of applying."}, {"no": 83, "q": "She desires to become a doctor.", "prompt": "She ______________________________ a doctor.", "answer": "She has a desire to become a doctor.", "structure": "have a desire to", "usage": "Công thức: desire to V = have a desire to V. Cả hai diễn tả mong muốn mạnh; cấu trúc có danh từ thường trang trọng hơn.", "meaning": "Câu mới nói cô ấy có mong muốn trở thành bác sĩ.", "example": "Ví dụ: He desires to travel. → He has a desire to travel."}, {"no": 84, "q": "I wish to see you again.", "prompt": "I ______________________________ to see you again.", "answer": "I have a wish to see you again.", "structure": "have a wish to", "usage": "Công thức: wish to V có thể đổi thành have a wish to V. Đây là cách dùng danh từ wish để diễn tả mong muốn.", "meaning": "Câu mới giữ ý người nói mong muốn gặp lại bạn.", "example": "Ví dụ: I wish to speak to you. → I have a wish to speak to you."}, {"no": 85, "q": "We visited our grandparents last weekend.", "prompt": "We ______________________________ our grandparents last weekend.", "answer": "We paid a visit to our grandparents last weekend.", "structure": "pay a visit to", "usage": "Công thức: visit someone/place = pay a visit to someone/place. Cụm này thường trang trọng hơn; giữ nguyên thời gian và tân ngữ.", "meaning": "Câu mới nói họ đã đến thăm ông bà vào cuối tuần trước.", "example": "Ví dụ: We visited our aunt. → We paid a visit to our aunt."}, {"no": 86, "q": "We discussed the problem yesterday.", "prompt": "We ______________________________ the problem yesterday.", "answer": "We had a discussion about the problem yesterday.", "structure": "have a discussion about", "usage": "Công thức: discuss + noun = have a discussion about + noun. Lưu ý discuss là ngoại động từ, không dùng “discuss about” trong tiếng Anh chuẩn.", "meaning": "Câu mới nói họ đã thảo luận về vấn đề hôm qua.", "example": "Ví dụ: We discussed the plan. → We had a discussion about the plan."}, {"no": 87, "q": "She decided to study abroad.", "prompt": "She ______________________________ abroad.", "answer": "She made a decision to study abroad.", "structure": "make a decision to", "usage": "Công thức: decide to V = make a decision to V. Sau decision dùng to-infinitive.", "meaning": "Câu mới giữ ý cô ấy quyết định đi du học.", "example": "Ví dụ: They decided to leave. → They made a decision to leave."}, {"no": 88, "q": "I talked to my teacher after class.", "prompt": "I ______________________________ my teacher after class.", "answer": "I had a talk with my teacher after class.", "structure": "have a talk with", "usage": "Công thức: talk to/with someone = have a talk with someone. Cụm danh từ “have a talk” diễn tả việc trò chuyện.", "meaning": "Câu mới nói người nói đã nói chuyện với giáo viên sau giờ học.", "example": "Ví dụ: I talked to my teacher. → I had a talk with my teacher."}, {"no": 89, "q": "He explained the problem clearly.", "prompt": "He ______________________________ the problem.", "answer": "He gave an explanation for the problem.", "structure": "give an explanation for", "usage": "Công thức: explain + object = give an explanation for + noun. Khi chuyển động từ explain sang danh từ explanation, thường dùng for để giới thiệu điều được giải thích.", "meaning": "Câu gốc nói anh ấy giải thích vấn đề rõ ràng; đáp án gốc đổi sang cụm danh từ nhưng không giữ rõ trạng từ “clearly”.", "example": "Ví dụ: She explained the delay. → She gave an explanation for the delay."}, {"no": 90, "q": "Please call me tonight.", "prompt": "Please ______________________________ tonight.", "answer": "Please give me a call tonight.", "structure": "give somebody a call", "usage": "Công thức: call someone = give someone a call. Đây là cách diễn đạt thân mật, phổ biến trong tiếng Anh.", "meaning": "Câu mới là lời yêu cầu gọi điện cho người nói tối nay.", "example": "Ví dụ: Call me later. → Give me a call later."}, {"no": 91, "q": "She is interested in art.", "prompt": "She ______________________________ art.", "answer": "She has interest in art.", "structure": "have interest in", "usage": "Công thức: be interested in + noun/V-ing có thể diễn đạt bằng have an interest in + noun/V-ing. Cách tự nhiên phổ biến là “have an interest in”; đáp án nguồn lược mạo từ an.", "meaning": "Câu mới nói cô ấy quan tâm đến nghệ thuật.", "example": "Ví dụ: He is interested in music. → He has an interest in music."}, {"no": 92, "q": "Would you like something to drink?", "prompt": "Would you like ______________________________?", "answer": "Would you like to have a drink?", "structure": "have a drink", "usage": "Công thức: have a drink là cụm động từ nghĩa là uống một thứ gì đó/uống một chút. Trong câu hỏi mời, “Would you like to have a drink?” là cách diễn đạt tự nhiên.", "meaning": "Câu mới mời người nghe uống gì đó.", "example": "Ví dụ: Would you like something to drink? → Would you like to have a drink?"}, {"no": 93, "q": "She photographed the old building.", "prompt": "She ______________________________ the old building.", "answer": "She had a photograph of the old building.", "structure": "have a photograph of", "usage": "Cụm “have a photograph of” nghĩa là có/giữ một bức ảnh chụp về ai/cái gì, không hoàn toàn đồng nghĩa với hành động “photograph”. Đáp án nguồn được giữ nguyên theo yêu cầu nhưng lưu ý sắc thái nghĩa khác nhau.", "meaning": "Câu gốc nói cô ấy chụp tòa nhà; đáp án nguồn nói cô ấy có một bức ảnh về tòa nhà, nên hai câu không hoàn toàn đồng nghĩa.", "example": "Ví dụ: She took a photo of the building. (Cô ấy chụp ảnh tòa nhà.) She has a photo of the building. (Cô ấy có ảnh tòa nhà.)"}, {"no": 94, "q": "The child cried loudly.", "prompt": "The child ______________________________.", "answer": "The child gave a cry.", "structure": "give a cry", "usage": "Cụm “give a cry” nghĩa là phát ra một tiếng kêu. Nó không phải lúc nào cũng thay thế “cry” khi cry có nghĩa là khóc; cần xem ngữ cảnh.", "meaning": "Đáp án diễn đạt đứa trẻ phát ra tiếng kêu lớn.", "example": "Ví dụ: He cried out in pain. → He gave a cry of pain."}, {"no": 95, "q": "They laughed at his mistake.", "prompt": "They ______________________________ his mistake.", "answer": "They gave a laugh at his mistake.", "structure": "give a laugh at", "usage": "Cụm “give a laugh” có thể diễn tả bật cười, nhưng “give a laugh at his mistake” kém tự nhiên hơn “laughed at his mistake”. Đáp án được giữ theo bản gốc.", "meaning": "Câu gốc có nghĩa họ cười nhạo lỗi lầm của anh ấy; cần lưu ý sắc thái “laugh at” có thể là chế giễu.", "example": "Ví dụ tự nhiên: They laughed at the joke."}, {"no": 96, "q": "The company is reviewing its recruitment policy.", "prompt": "The company’s recruitment policy ______________________________.", "answer": "The company’s recruitment policy is being reviewed.", "structure": "passive: be + V3", "usage": "Câu bị động cơ bản: tân ngữ câu chủ động được đưa lên làm chủ ngữ; dùng be đúng thì + V3. Tác nhân có thể được lược nếu không cần nêu.", "meaning": "Chính sách tuyển dụng là đối tượng đang được xem xét; câu nguồn ở hiện tại tiếp diễn nên đáp án dùng “is being reviewed”.", "example": "Ví dụ: They are checking the policy. → The policy is being checked."}, {"no": 97, "q": "People are building a new bridge here.", "prompt": "A new bridge ______________________________ here.", "answer": "A new bridge is being built here.", "structure": "passive: be + being + V3", "usage": "Bị động hiện tại tiếp diễn: am/is/are + being + V3. Dùng khi hành động đang diễn ra tại thời điểm nói.", "meaning": "Cây cầu mới đang được xây ở đây; new bridge là chủ ngữ nhận hành động.", "example": "Ví dụ: They are painting the house. → The house is being painted."}, {"no": 98, "q": "They have completed the project.", "prompt": "The project ______________________________.", "answer": "The project has been completed.", "structure": "present perfect passive", "usage": "Bị động hiện tại hoàn thành: has/have + been + V3. Dùng khi hành động đã hoàn thành và có liên hệ với hiện tại.", "meaning": "“The project has been completed” nghĩa là dự án đã được hoàn thành.", "example": "Ví dụ: They have finished the work. → The work has been finished."}, {"no": 99, "q": "Someone stole my bicycle yesterday.", "prompt": "My bicycle ______________________________ yesterday.", "answer": "My bicycle was stolen yesterday.", "structure": "past simple passive", "usage": "Bị động quá khứ đơn: was/were + V3. Dùng khi hành động đã xảy ra trong quá khứ; chọn was/were theo chủ ngữ số ít/số nhiều.", "meaning": "Chiếc xe đạp là đối tượng bị lấy trộm hôm qua.", "example": "Ví dụ: Someone broke the window. → The window was broken."}, {"no": 100, "q": "They will announce the results tomorrow.", "prompt": "The results ______________________________ tomorrow.", "answer": "The results will be announced tomorrow.", "structure": "future passive: will be + V3", "usage": "Bị động tương lai đơn: will be + V3. Dùng khi hành động sẽ được thực hiện với đối tượng trong tương lai.", "meaning": "Kết quả sẽ được công bố vào ngày mai; “the results” là đối tượng nhận hành động announce.", "example": "Ví dụ: They will publish the report. → The report will be published."}];let idx=0;const results={};const attempts={};const hints={
'spend + time + V-ing':'Đổi “It takes/took + người + thời gian + to V” sang “người + spend/spent + thời gian + V-ing”.',
'be aware of':'Tìm cụm gần nghĩa với “understand/know”; sau aware of dùng danh từ hoặc cụm danh từ.',
'be interested in + V-ing':'Sau giới từ in, nếu theo sau là một hành động thì dùng V-ing.',
'because of + noun':'Sau because of dùng danh từ/cụm danh từ, không dùng nguyên mệnh đề S + V.',
'despite + noun':'Sau despite dùng danh từ/cụm danh từ; có thể đổi tính từ hoặc mệnh đề thành cụm danh từ.',
'despite + V-ing':'Sau despite có thể dùng V-ing để rút gọn mệnh đề nhượng bộ.',
'manage to + V':'Đổi “succeed in + V-ing” sang “manage to + động từ nguyên mẫu”.',
'not + adjective + enough + to V':'Dùng tính từ trái nghĩa với tính từ sau too; enough đứng sau tính từ.',
'would rather + subject + past verb':'Khi muốn người khác làm gì: would rather + chủ ngữ khác + động từ quá khứ đơn.',
'would rather + V + than + V':'Dùng động từ nguyên mẫu không “to” ở cả hai vế sau would rather…than.',
'be able to + V':'Đổi can + V thành be able to + V; nhớ chia động từ be theo chủ ngữ.',
'Hardly had + S + V3 + when + S + V2':'Đảo ngữ: Hardly + had + chủ ngữ + V3 + when + mệnh đề quá khứ đơn.',
'no longer':'Đặt no longer trước động từ thường; với be, đặt sau be.',
'At no time + inversion':'Cụm phủ định đầu câu cần đảo trợ động từ lên trước chủ ngữ.',
};
const app=document.getElementById('app'),progress=document.getElementById('progress'),score=document.getElementById('score');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function norm(s){return s.toLowerCase().trim().replace(/[’‘`]/g,"'").replace(/\s+/g,' ').replace(/\s+([,.!?])/g,'$1').replace(/[.]+$/,'').replace(/\s+/g,' ')}
function hintFor(q){return hints[q.structure]||('Gợi ý: hãy chú ý cấu trúc “'+q.structure+'”. Xác định phần nào của câu gốc cần đổi, giữ nguyên thì, chủ ngữ và ý nghĩa chính.')}
function updateBar(){progress.textContent=`Question ${idx+1} of ${qs.length}`;let n=Object.values(results).filter(Boolean).length;let done=Object.keys(results).length;score.textContent=`Score: ${n} / ${qs.length} · Checked: ${done} / ${qs.length}`}
function render(){const q=qs[idx],saved=attempts[idx]||'';updateBar();app.innerHTML=`<div class="card"><div class="badge">Question ${q.no} · ${esc(q.structure)}</div><div class="label">Original sentence</div><div class="original">${esc(q.q)}</div><div class="label">Rewrite the sentence</div><div class="prompt">${esc(q.prompt)}</div><textarea id="answer" placeholder="Write your complete sentence here...">${esc(saved)}</textarea><div class="actions"><button class="hintbtn" onclick="toggleHint()">Show Hint</button><button class="check" onclick="checkAnswer()">Check / Recheck Answer</button><button class="prev" onclick="go(-1)" ${idx===0?'disabled':''}>Previous</button><button class="next" onclick="go(1)" ${idx===qs.length-1?'disabled':''}>Next</button></div><div id="hint" class="hint" style="display:none">${esc(hintFor(q))}</div><div class="jump"><label for="jumpTo">Go to question:</label> <select id="jumpTo" onchange="jumpQuestion(this.value)">${qs.map((x,i)=>`<option value="${i}" ${i===idx?'selected':''}>Question ${x.no}</option>`).join('')}</select><button class="jumpbtn" onclick="jumpQuestion(document.getElementById('jumpTo').value)">Go</button></div><div id="feedback" class="feedback"></div></div>`;
if(results[idx]!==undefined) showFeedback();}
function toggleHint(){const h=document.getElementById('hint');h.style.display=h.style.display==='none'?'block':'none';}
function checkAnswer(){const input=document.getElementById('answer').value.trim();if(!input){document.getElementById('answer').focus();return}attempts[idx]=input;const q=qs[idx];results[idx]=norm(input)===norm(q.answer);showFeedback();updateBar()}
function showFeedback(){const q=qs[idx],ok=!!results[idx],fb=document.getElementById('feedback');fb.className='feedback '+(ok?'correct':'wrong');fb.innerHTML=(ok?'<strong>✓ Correct!</strong>':'<strong>✗ Not quite. You can edit your answer and check again.</strong>')+`<div class="answer">Model answer: ${esc(q.answer)}</div><div class="structure">Structure: ${esc(q.structure)}</div><div class="explain"><p><strong>Giải thích cách dùng:</strong> ${esc(q.usage)}</p><p><strong>Ý nghĩa:</strong> ${esc(q.meaning)}</p><p><strong>Ví dụ tương tự:</strong> ${esc(q.example)}</p></div>`;}
function go(delta){const a=document.getElementById('answer');if(a)attempts[idx]=a.value;idx=Math.max(0,Math.min(qs.length-1,idx+delta));render()}
function jumpQuestion(value){const a=document.getElementById('answer');if(a)attempts[idx]=a.value;idx=Math.max(0,Math.min(qs.length-1,Number(value)||0));render()}
render();
</script></body></html>
